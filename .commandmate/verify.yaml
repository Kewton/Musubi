# .commandmate/verify.yaml — v1
# 「このリポジトリで何が通れば合格か」の唯一の定義。
# 次の経路がすべてこのファイルを読む。食い違わせないこと。
#   - cmate-verify（ローカル）
#   - commandmate verify <worktree-id>（サーバー）
#   - commandmate wait <worktree-id> --verify（実行契約の裁定）
#   - .github/workflows/ci.yml の lint-typecheck-unit ジョブ
#
# ── 誰がこのファイルを直すか（2026-09-12 決定・00b / CLAUDE.md）──────────────
# **ワーカーはこのファイルを編集できない。** CommandMate は .commandmate/ を scope.allow から
# 既定で外し、profile でも緩められない（profile-contract.md §9.6）。
# 「審判を書き換えられる被審判は、審判されていない」ためである。
#
# **ゲートの追加・削除は人（監督側）が、ci.yml と同時に1コミットで行う。**
# ワーカーが ci.yml だけにゲートを足すと verify-parity が落ち、PR はマージできない。
# それが「人の手が要る」ことの合図である。
#
# ── 食い違いの機械検知 ──────────────────────────────────────────────
# gate id の並びは ci.yml の `# verify-gate: <id>` 目印と**順序まで**一致しなければならない。
# .commandmate/scripts/check-verify-parity.mjs が照合し、ズレていれば verify-parity ゲートが落ちる。
# 目印の無い run ステップが ci.yml にあっても落ちる（目印を付けずに足す抜け道を塞ぐ）。
#
# lint に含まれるもの（package.json の scripts.lint）:
#   1. turbo run lint      … oxlint。cloudflare:workers の直接 import を app-do 以外で禁止
#   2. check-deps.mjs      … 依存の向きを infra/scripts/dep-graph.mjs と照合し、
#                            package.json と tsconfig references の両方の一致を要求する
#
# tf-fmt / tf-validate（2026-09-13 追加・#3 完了後）:
#   .commandmate/scripts/check-terraform.sh を呼ぶ。資格情報を一切使わない（init -backend=false）。
#   入っている terraform が .terraform-version と一致しなければ落ちる。ローカルは tfenv が要る。
#
# 【追加予定のゲート】対象ファイルが揃った時点で、人が ci.yml と同時に足す：
#   - pnpm infra:sync --env staging --check  （Issue #13）
version: 1
gates:
  - id: deps
    command: "corepack enable >/dev/null 2>&1 || true; pnpm install --frozen-lockfile"
    timeoutSec: 600
  - id: verify-parity
    command: "pnpm check:verify-parity"
    timeoutSec: 60
  - id: lint
    command: "pnpm lint"
    timeoutSec: 300
  - id: typecheck
    command: "pnpm typecheck"
    timeoutSec: 300
  - id: unit
    command: "pnpm test"
    timeoutSec: 600
  - id: tf-fmt
    command: "pnpm check:tf-fmt"
    timeoutSec: 120
  - id: tf-validate
    command: "pnpm check:tf-validate"
    timeoutSec: 600
options:
  baseRef: origin/main
  skipInPrimaryCheckout: true
  maxLogTailBytes: 8192
  requireCommit: true
