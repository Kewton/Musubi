name: ci
on:
  pull_request:
  push: { branches: [main] }

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 既定は read のみ。必要なジョブだけが昇格する（H-07 の方針）。
permissions:
  contents: read

jobs:
  lint-typecheck-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .node-version, cache: pnpm }
      # ── ここから下の run ステップは .commandmate/verify.yaml の gates と1対1で対応する ──
      # 各ステップの直前の `# verify-gate: <id>` を .commandmate/scripts/check-verify-parity.mjs が
      # verify.yaml の gate id と順序まで照合する。目印の無い run ステップを足すと落ちる。
      # ゲートの追加・削除は人（監督側）が verify.yaml と同時に行う（CLAUDE.md）。
      # verify-gate: deps
      - run: pnpm install --frozen-lockfile
      # verify-gate: verify-parity
      - run: pnpm check:verify-parity
      # verify-gate: lint
      - run: pnpm lint
      # verify-gate: typecheck
      - run: pnpm typecheck
      # verify-gate: unit
      - run: pnpm test
      # 【追加予定のゲート】対象ファイルが揃った時点で、人が verify.yaml と同時に足す：
      #   terraform fmt -check / terraform validate（Issue #3 完了後）
      #   pnpm infra:sync --env staging --check  （Issue #13）

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
